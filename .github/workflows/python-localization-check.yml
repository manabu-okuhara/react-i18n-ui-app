name: Python Localization Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/locales/**"
      - "localization_tools/**"
      - "tests_python/**"
      - "pyproject.toml"
      - "requirements-python-dev.txt"
      - ".github/workflows/python-localization-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-python-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install --requirement requirements-python-dev.txt

      - name: Run localization resource linter
        id: resource_linter
        continue-on-error: true
        run: python -m localization_tools.cli

      - name: Run Python tests
        run: python -m pytest

      - name: Upload localization reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-localization-report
          path: |
            python-localization-report.md
            python-localization-report.json
          if-no-files-found: warn

      - name: Add localization workflow summary
        if: always()
        run: |
          if [ -f python-localization-report.md ]; then
            cat python-localization-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Python localization report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce localization result
        if: steps.resource_linter.outcome == 'failure'
        run: |
          echo "Python localization resource checks found blocking errors."
          exit 1
