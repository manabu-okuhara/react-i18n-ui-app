name: Pull, Validate, and Propose Lokalise Translations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [lokalise-translations-complete]

concurrency:
  group: lokalise-returned-translations
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  pull_validate:
    name: Pull and validate reviewed translations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-python-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install --requirement requirements-python-dev.txt

      - name: Validate Lokalise return configuration
        env:
          LOKALISE_API_TOKEN: ${{ secrets.LOKALISE_API_TOKEN }}
          LOKALISE_PROJECT_ID: ${{ secrets.LOKALISE_PROJECT_ID }}
        run: |
          test -n "$LOKALISE_API_TOKEN" || {
            echo "LOKALISE_API_TOKEN is not configured."
            exit 1
          }
          test -n "$LOKALISE_PROJECT_ID" || {
            echo "LOKALISE_PROJECT_ID is not configured."
            exit 1
          }

      - name: Download reviewed translations from Lokalise
        env:
          LOKALISE_API_TOKEN: ${{ secrets.LOKALISE_API_TOKEN }}
          LOKALISE_PROJECT_ID: ${{ secrets.LOKALISE_PROJECT_ID }}
          LOKALISE_RETURN_FILTER: reviewed_only
        run: |
          python -m localization_tools.lokalise_pull \
            --locale-dir src/locales \
            --source-name en-US.json \
            --metadata-output lokalise-return-metadata.json

      - name: Validate returned locale bundles
        id: resource_linter
        run: python -m localization_tools.cli

      - name: Run Python localization tests
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run React regression tests
        run: |
          npm ci
          npm test -- --watchAll=false

      - name: Check for returned translation changes
        id: translation_changes
        run: |
          if git diff --quiet -- src/locales; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No returned translation changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Returned translation changes detected."
          fi

      - name: Upload returned translation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lokalise-returned-translation-report
          path: |
            python-localization-report.md
            python-localization-report.json
            lokalise-return-metadata.json
          if-no-files-found: warn

      - name: Add returned translation summary
        if: always()
        run: |
          {
            echo '## Returned Lokalise Translation Validation'
            echo
            if [ -f lokalise-return-metadata.json ]; then
              echo '### Export metadata'
              echo
              echo '```json'
              cat lokalise-return-metadata.json
              echo '```'
              echo
            fi
            if [ -f python-localization-report.md ]; then
              cat python-localization-report.md
            else
              echo 'Python localization report was not generated.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create translation pull request
        if: success() && steps.translation_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/lokalise-returned-translations
          delete-branch: true
          commit-message: "chore(i18n): import reviewed Lokalise translations"
          title: "chore(i18n): import reviewed Lokalise translations"
          body: |
            ## Returned Lokalise translations

            This automated pull request contains reviewed target-locale JSON bundles downloaded from Lokalise.

            Before creating this pull request, the workflow:
            - downloaded only `reviewed_only` JSON translations;
            - prevented `en-US.json` from being overwritten;
            - validated returned bundles with the Python resource linter;
            - ran Python and React regression tests; and
            - uploaded validation reports and export metadata as workflow artifacts.

            Please review translation quality, locale-specific context, and any nonblocking warnings before merging.
          labels: localization, automated
